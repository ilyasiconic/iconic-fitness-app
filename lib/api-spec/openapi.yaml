openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GYMCO customer API — multi-gym memberships, classes, bookings, check-ins, and fitness tracking.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: gyms
  - name: classes
  - name: bookings
  - name: memberships
  - name: trainers
  - name: wallet
  - name: referrals
    description: Refer & Earn — referral codes and wallet points
  - name: dashboard
  - name: tracking
    description: Daily wellness tracking — water, meals/calories, workouts, steps, goals, progress
  - name: checkins
    description: Member gym check-ins
  - name: ai
    description: Iconic Fitness AI assistant
paths:
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with the Iconic Fitness AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI assistant not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /ai/coach:
    post:
      operationId: aiCoach
      tags: [ai]
      summary: Personalized AI fitness coach (uses the member's own tracking data)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatInput" }
      responses:
        "200":
          description: Coach reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
        "503":
          description: AI coach not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatOutput" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get the current user profile + fitness stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
    patch:
      operationId: updateMe
      tags: [profile]
      summary: Update the current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Personalized home dashboard summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /home-slides:
    get:
      operationId: listHomeSlides
      tags: [gyms]
      summary: Active home banner slides (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HomeSlide" }
  /store/categories:
    get:
      operationId: listStoreCategories
      tags: [gyms]
      summary: Active storefront product categories (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreCategory" }
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [gyms]
      summary: Active storefront products (public)
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string }
        - in: query
          name: q
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreProduct" }
  /store/checkout:
    post:
      operationId: storeCheckout
      tags: [gyms]
      summary: Start a store order with online payment (guest or signed-in)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreCheckoutRequest" }
      responses:
        "200":
          description: Order placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckoutResponse" }
        "400":
          description: Invalid input
  /store/orders/mine:
    get:
      operationId: listMyStoreOrders
      tags: [gyms]
      summary: Store orders of the signed-in member, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreOrder" }
        "401":
          description: Not signed in
  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: Search and filter gyms
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string, description: "e.g. gym, yoga, crossfit, pilates, mma, swimming, zumba" }
        - in: query
          name: amenity
          schema: { type: string }
        - in: query
          name: lat
          schema: { type: number, description: "User latitude; when provided with lng, distanceKm is computed from the user's location." }
        - in: query
          name: lng
          schema: { type: number, description: "User longitude; when provided with lat, distanceKm is computed from the user's location." }
        - in: query
          name: sort
          schema: { type: string, enum: [distance, rating, price] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/featured:
    get:
      operationId: listFeaturedGyms
      tags: [gyms]
      summary: Curated featured gyms for the homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gym" }
  /gyms/categories:
    get:
      operationId: listGymCategories
      tags: [gyms]
      summary: Categories with counts (for filter chips)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryCount" }
  /gyms/{gymId}:
    get:
      operationId: getGym
      tags: [gyms]
      summary: Get a single gym with full details
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GymDetail" }
  /gyms/{gymId}/classes:
    get:
      operationId: listGymClasses
      tags: [classes]
      summary: List upcoming class sessions at a gym
      parameters:
        - in: path
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Browse upcoming class sessions across all gyms
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, description: "ISO date (YYYY-MM-DD)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /classes/trending:
    get:
      operationId: listTrendingClasses
      tags: [classes]
      summary: Trending classes (booked the most this week)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassSession" }
  /classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a single class session
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassSessionDetail" }

  /memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List available membership plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPlan" }
  /package-categories:
    get:
      operationId: listPackageCategories
      tags: [memberships]
      summary: List active package categories (admin-managed, sorted)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PackageCategory" }
  /membership-lookup:
    post:
      operationId: lookupMembership
      tags: [memberships]
      summary: Check whether a mobile number belongs to a gym member (pre-signup verification)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipLookupBody" }
      responses:
        "200":
          description: Lookup result (found=false when no member matches)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipLookupResult" }
        "429":
          description: Too many lookups; try again later
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /memberships/mine:
    get:
      operationId: getMyMembership
      tags: [memberships]
      summary: Get the user's current active membership (null if none)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MyMembership"
                  - type: "null"
  /memberships/mine/renew:
    post:
      operationId: createMembershipRenewal
      tags: [memberships]
      summary: Start an online renewal payment for the member's current YoActiv plan
      responses:
        "200":
          description: Pending renewal purchase created; pay via paymentUrl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageBookingCreated" }
        "409":
          description: Online renewal isn't available (no linked plan or branch)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /memberships/mine/payments:
    get:
      operationId: listMyMembershipPayments
      tags: [memberships]
      summary: List the user's plan purchase/renewal history (from YoActiv; empty if not linked)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MembershipPayment" }

  /settings/notification-sounds:
    get:
      operationId: getNotificationSounds
      tags: [settings]
      summary: Custom notification sound URLs (null = default ringtone)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSounds" }
  /admin/settings/notification-sounds:
    put:
      operationId: setNotificationSound
      tags: [settings]
      summary: Admin — set or clear the custom notification sound for an audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience: { type: string, enum: [members, trainers] }
                url: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSounds" }

  /notifications/mine:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      summary: List the member's notifications (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/mine/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
  /notifications/mine/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the member's notifications as read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List the user's bookings
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [upcoming, past, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Booking" }
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a class session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
  /bookings/{bookingId}:
    delete:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }


  /trainers/live:
    get:
      operationId: listLiveTrainers
      tags: [trainers]
      summary: Live personal-trainer roster from the gym-management system (empty if unavailable)
      parameters:
        - in: query
          name: gymId
          schema: { type: integer }
          description: Scope the roster to a branch (gym) when it is mapped to a YoActiv branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LiveTrainer" }

  /trainer-packages:
    get:
      operationId: listTrainerPackages
      tags: [trainers]
      summary: Purchasable session packages for a branch (live prices from the gym-management system)
      parameters:
        - in: query
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerPackage" }

  /trainer-bookings:
    post:
      operationId: createTrainerBooking
      tags: [trainers]
      summary: Start a paid trainer-session booking; returns the hosted payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTrainerBookingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerBookingCreated" }
  /trainer-bookings/mine:
    get:
      operationId: listMyTrainerBookings
      tags: [trainers]
      summary: The caller's PT bookings (paid/pending) and session-request enquiries, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerBooking" }
  /trainer-bookings/{bookingId}:
    get:
      operationId: getTrainerBooking
      tags: [trainers]
      summary: Status of one of the caller's trainer bookings
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainerBooking" }

  /pt/mine:
    get:
      operationId: getMyPtProgram
      tags: [trainers]
      summary: The caller's active PT program (assigned trainer + scheduled sessions)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PtProgram" }

  /complaints:
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Raise a complaint ticket (goes to admins and the branch partner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintCreate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
  /complaints/mine:
    get:
      operationId: listMyComplaints
      tags: [complaints]
      summary: The caller's complaint tickets, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Complaint" }

  /complaints/{id}/follow-up:
    post:
      operationId: addComplaintFollowUp
      tags: [complaints]
      summary: Add a member follow-up message and/or reopen a resolved complaint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplaintFollowUpRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }

  /pt/trial-feedback/mine:
    get:
      operationId: listMyPtTrialFeedback
      tags: [trainers]
      summary: The caller's kick-starter trial session feedback entries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PtTrialFeedback" }

  /pt/trial-feedback:
    post:
      operationId: submitPtTrialFeedback
      tags: [trainers]
      summary: Submit (or update) feedback for a kick-starter trial session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitPtTrialFeedbackRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PtTrialFeedback" }

  /engagement/mine:
    get:
      operationId: getMyEngagement
      tags: [trainers]
      summary: The caller's 45-day engagement program (auto-starts after the kick-starter trial), today's workout card and engagement score
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEngagement" }

  /engagement/plan:
    get:
      operationId: getMyEngagementPlan
      tags: [trainers]
      summary: The full 45-day workout plan for the caller's level
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyEngagementPlan" }

  /assessment/mine:
    get:
      operationId: getMyAssessment
      tags: [trainers]
      summary: The caller's empty-stomach fitness assessment booking, eligibility and bookable morning slot times
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAssessment" }

  /assessment/book:
    post:
      operationId: bookAssessment
      tags: [trainers]
      summary: Book (or reschedule) the early-morning empty-stomach fitness assessment slot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookAssessmentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentBooking" }

  /assessment/cancel:
    post:
      operationId: cancelAssessment
      tags: [trainers]
      summary: Cancel the caller's upcoming fitness assessment booking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /membership-packages:
    get:
      operationId: listMembershipPackages
      tags: [memberships]
      summary: Purchasable membership packages for a branch (live prices from the gym-management system)
      parameters:
        - in: query
          name: gymId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainerPackage" }

  /coupons/preview:
    post:
      operationId: previewCoupon
      tags: [memberships]
      summary: Check a coupon code against a purchase amount and get the discount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponPreviewRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponPreviewResponse" }
  /package-bookings:
    post:
      operationId: createPackageBooking
      tags: [memberships]
      summary: Start a paid membership-package purchase; returns the hosted payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePackageBookingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageBookingCreated" }

  /package-bookings/mine:
    get:
      operationId: listMyPackageBookings
      tags: [memberships]
      summary: The caller's membership-package purchases, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PackageBooking" }

  /package-bookings/{bookingId}:
    get:
      operationId: getPackageBooking
      tags: [memberships]
      summary: Status of one of the caller's package purchases
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
        - in: query
          name: token
          required: false
          schema: { type: string }
          description: "Purchase access token — lets a guest poll their own purchase without signing in"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageBooking" }

  /referrals/mine:
    get:
      operationId: getMyReferralInfo
      tags: [referrals]
      summary: The caller's referral code, wallet points balance and reward history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralInfo" }

  /referrals/apply:
    post:
      operationId: applyReferralCode
      tags: [referrals]
      summary: Apply another member's referral code to the caller's account (once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralInfo" }

  /trainers:
    get:
      operationId: listTrainers
      tags: [trainers]
      summary: Browse trainers in the marketplace
      parameters:
        - in: query
          name: specialty
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trainer" }
  /trainers/{trainerId}:
    get:
      operationId: getTrainer
      tags: [trainers]
      summary: Trainer profile
      parameters:
        - in: path
          name: trainerId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trainer" }

  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List challenges with the current user's progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Challenge" }
  /challenges/{challengeId}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Challenge detail with leaderboard
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
  /challenges/{challengeId}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join a challenge
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }
  /challenges/{challengeId}/leave:
    post:
      operationId: leaveChallenge
      tags: [challenges]
      summary: Leave a challenge
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeDetail" }

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Wallet balance and recent transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }

  /tracking/summary:
    get:
      operationId: getTrackingSummary
      tags: [tracking]
      summary: Today's wellness summary (water, calories, steps, workouts, streak)
      parameters:
        - in: query
          name: date
          schema: { type: string, description: "YYYY-MM-DD (IST); defaults to today" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailySummary" }

  /tracking/water:
    get:
      operationId: getWaterDay
      tags: [tracking]
      summary: Water intake entries for a day
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterDay" }
    post:
      operationId: addWater
      tags: [tracking]
      summary: Log water intake
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaterDay" }
  /tracking/water/{id}:
    delete:
      operationId: deleteWater
      tags: [tracking]
      summary: Remove a water entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/meals:
    get:
      operationId: getMealDay
      tags: [tracking]
      summary: Meals logged for a day with calorie/macro totals
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealDay" }
    post:
      operationId: addMeal
      tags: [tracking]
      summary: Log a meal / food item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealDay" }
  /tracking/meals/{id}:
    delete:
      operationId: deleteMeal
      tags: [tracking]
      summary: Remove a meal entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/workouts:
    get:
      operationId: getWorkoutDay
      tags: [tracking]
      summary: Workouts logged for a day with totals
      parameters:
        - in: query
          name: date
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutDay" }
    post:
      operationId: addWorkout
      tags: [tracking]
      summary: Log a workout / activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutDay" }
  /tracking/workouts/{id}:
    delete:
      operationId: deleteWorkout
      tags: [tracking]
      summary: Remove a workout entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /tracking/progress:
    get:
      operationId: getProgress
      tags: [tracking]
      summary: Multi-day progress series for charts
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 7, description: "Number of trailing days (1-31)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressReport" }

  /tracking/goals:
    get:
      operationId: getGoals
      tags: [tracking]
      summary: Get the user's daily goals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }
    patch:
      operationId: updateGoals
      tags: [tracking]
      summary: Update daily goals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalsUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goals" }

  /checkins:
    get:
      operationId: listMyCheckins
      tags: [checkins]
      summary: The user's recent gym check-ins
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkin" }
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Check in to a gym (once per gym per day)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }

components:
  schemas:
    NotificationSounds:
      type: object
      required: [members, trainers]
      properties:
        members: { type: string, nullable: true }
        trainers: { type: string, nullable: true }
    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: ["user", "assistant"] }
        content: { type: string }
    AiChatInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AiChatMessage" }
    AiChatOutput:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserProfile:
      type: object
      required:
        [
          id, name, email, mobile, gender, age, heightCm, weightKg,
          fitnessGoal, avatarUrl, city, bmi, fitnessScore,
          dailyCalories, dailyWaterMl, dailySleepHours, restingHr,
          streakDays, weeklyWorkouts, weeklyGoal, joinedAt,
          assessmentComplete, bmr, tdee, bodyFatPct
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        fitnessGoal: { type: string }
        avatarUrl: { type: string }
        city: { type: string }
        bmi: { type: number }
        fitnessScore: { type: integer, description: "0-100 composite AI score" }
        dailyCalories: { type: integer }
        dailyWaterMl: { type: integer }
        dailySleepHours: { type: number }
        restingHr: { type: integer }
        streakDays: { type: integer }
        weeklyWorkouts: { type: integer }
        weeklyGoal: { type: integer }
        joinedAt: { type: string, format: date-time }
        assessmentComplete:
          { type: boolean, description: "True once the AI fitness assessment is done" }
        experienceLevel:
          { type: string, nullable: true, description: "new | experienced" }
        targetWeightKg: { type: number, nullable: true }
        bmr: { type: number, description: "Basal metabolic rate (kcal); 0 if unknown" }
        tdee: { type: number, description: "Maintenance calories (kcal); 0 if unknown" }
        bodyFatPct: { type: number, description: "Estimated body fat %; 0 if unknown" }
    MembershipLookupBody:
      type: object
      required: [mobile]
      properties:
        mobile: { type: string, minLength: 10 }
    MembershipLookupResult:
      type: object
      required: [found, memberName, branchName]
      properties:
        found: { type: boolean }
        memberName:
          { type: string, description: "Masked member name (e.g. \"Rah••• K.\"); empty when not found" }
        branchName:
          { type: string, description: "Branch of the member's primary plan; empty when not found" }

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        fitnessGoal: { type: string }
        avatarUrl: { type: string }
        city: { type: string }
        weeklyGoal: { type: integer }

    HomeSlide:
      type: object
      required: [id, kind, mediaUrl, title, subtitle, ctaLabel, ctaUrl, audience]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [image, gif, youtube] }
        mediaUrl:
          { type: string, description: "db-image URL / GIF URL, or a YouTube URL when kind=youtube" }
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        audience:
          type: string
          enum: [all, members, customers]
          description: "Who sees this slide: all viewers, members (active plan) only, or customers (non-members) only"
    StoreCategory:
      type: object
      required: [name, slug, sortOrder]
      properties:
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
    StoreProduct:
      type: object
      required:
        [id, name, slug, category, priceInr, originalPriceInr, imageUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        priceInr: { type: integer }
        originalPriceInr: { type: integer }
        imageUrl: { type: string }
        gallery: { type: array, items: { type: string } }
        stock: { type: integer }
        status: { type: string }
        description: { type: string }
        sizes: { type: array, items: { type: string } }
        colors: { type: array, items: { type: string } }
        cgstPercent: { type: number }
        sgstPercent: { type: number }
    StoreCheckoutRequest:
      type: object
      required:
        [
          customerName, customerEmail, customerPhone, shippingAddress,
          shippingCity, shippingPincode, items
        ]
      properties:
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string }
        shippingAddress: { type: string }
        shippingCity: { type: string }
        shippingPincode: { type: string }
        redeemPoints: { type: integer, description: "Wallet points to apply (signed-in only, 1 point = ₹1)" }
        items:
          type: array
          items:
            type: object
            required: [productId, qty]
            properties:
              productId: { type: integer }
              qty: { type: integer }
              size: { type: string }
              color: { type: string }
    StoreCheckoutResponse:
      type: object
      required: [ok, orderId, total, redeemedInr, paymentUrl]
      properties:
        ok: { type: boolean }
        orderId: { type: integer }
        total: { type: integer }
        redeemedInr: { type: integer }
        subtotalInr: { type: integer }
        cgstInr: { type: integer }
        sgstInr: { type: integer }
        shippingInr: { type: integer }
        paymentUrl:
          type: string
          description: Open in the system browser to pay (Airpay hosted page)
    StoreOrderItem:
      type: object
      required: [id, productName, unitPriceInr, qty, variant, status]
      properties:
        id: { type: integer }
        productName: { type: string }
        unitPriceInr: { type: integer }
        qty: { type: integer }
        variant: { type: string }
        status: { type: string }
    StoreOrder:
      type: object
      required:
        [id, totalInr, pointsRedeemedInr, paymentMethod, status, createdAt, items]
      properties:
        id: { type: integer }
        totalInr: { type: integer }
        pointsRedeemedInr: { type: integer }
        subtotalInr: { type: integer }
        cgstInr: { type: integer }
        sgstInr: { type: integer }
        shippingInr: { type: integer }
        paymentMethod: { type: string }
        status:
          type: string
          description: "placed | confirmed | shipped | delivered | cancelled"
        createdAt: { type: string }
        shippingAddress: { type: string }
        shippingCity: { type: string }
        shippingPincode: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/StoreOrderItem" }
    Gym:
      type: object
      required:
        [
          id, name, slug, city, area, address, heroImage, logoUrl, rating,
          reviewsCount, priceFrom, categories, amenities, distanceKm,
          isPremium, openNow
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        city: { type: string }
        area: { type: string }
        address: { type: string }
        heroImage: { type: string }
        videoUrl:
          { type: string, nullable: true, description: "Optional hero video URL (YouTube, Vimeo, or direct mp4). Shown as first slide with autoplay." }
        logoUrl: { type: string, description: "Gym logo image URL (may be empty)" }
        rating: { type: number }
        reviewsCount: { type: integer }
        priceFrom: { type: integer, description: "Monthly price in INR" }
        categories:
          type: array
          items: { type: string }
        amenities:
          type: array
          items: { type: string }
        distanceKm: { type: number }
        isPremium: { type: boolean }
        openNow: { type: boolean }
        onlinePurchase:
          {
            type: boolean,
            description: "True when this branch supports paid online package purchase (mapped to a YoActiv branch)",
          }
    GymDetail:
      allOf:
        - $ref: "#/components/schemas/Gym"
        - type: object
          required: [about, gallery, hours, lat, lng, trainers, upcomingClasses]
          properties:
            about: { type: string }
            gallery:
              type: array
              items: { type: string }
            hours: { type: string }
            lat: { type: number }
            lng: { type: number }
            trainers:
              type: array
              items: { $ref: "#/components/schemas/Trainer" }
            upcomingClasses:
              type: array
              items: { $ref: "#/components/schemas/ClassSession" }

    CategoryCount:
      type: object
      required: [category, count, icon]
      properties:
        category: { type: string }
        count: { type: integer }
        icon: { type: string, description: "lucide icon name hint" }

    ClassSession:
      type: object
      required:
        [
          id, title, category, gymId, gymName, gymCity, trainerName,
          startsAt, durationMin, capacity, booked, intensity, coverImage
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        gymId: { type: integer }
        gymName: { type: string }
        gymCity: { type: string }
        trainerName: { type: string }
        startsAt: { type: string, format: date-time }
        durationMin: { type: integer }
        capacity: { type: integer }
        booked: { type: integer }
        intensity: { type: string, enum: [low, medium, high] }
        coverImage: { type: string }
    ClassSessionDetail:
      allOf:
        - $ref: "#/components/schemas/ClassSession"
        - type: object
          required: [description, equipmentNeeded, calorieEstimate]
          properties:
            description: { type: string }
            equipmentNeeded:
              type: array
              items: { type: string }
            calorieEstimate: { type: integer }

    MembershipPlan:
      type: object
      required:
        [
          id, name, tagline, billingPeriod, priceInr, originalPriceInr,
          gymsIncluded, classesPerMonth, perks, badge, popular
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        tagline: { type: string }
        billingPeriod: { type: string, enum: [monthly, quarterly, half_yearly, yearly, annual] }
        priceInr: { type: integer }
        originalPriceInr: { type: integer }
        gymsIncluded: { type: integer }
        classesPerMonth: { type: integer }
        perks:
          type: array
          items: { type: string }
        badge: { type: string }
        popular: { type: boolean }
        imageUrl: { type: string }
        categoryId:
          {
            type: integer,
            description: "package_categories id; 0 = uncategorized",
          }
    PackageCategory:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: integer }
        name: { type: string }
        sortOrder: { type: integer }
        imageUrl: { type: string }
    MyMembership:
      type: object
      required: [planId, planName, renewsOn, classesUsed, classesIncluded, gymsAccessed, status]
      properties:
        planId: { type: integer }
        planName: { type: string }
        renewsOn: { type: string, format: date-time }
        classesUsed: { type: integer }
        classesIncluded: { type: integer }
        gymsAccessed: { type: integer }
        status: { type: string, enum: [active, paused, expired] }
        source: { type: string, enum: [local, yoactiv] }
        photoUrl:
          {
            type: string,
            nullable: true,
            description: "Member photo hosted by YoActiv, when one exists there",
          }
        startedOn:
          {
            type: string,
            nullable: true,
            description: "ISO date the current plan started (YoActiv only)",
          }
        branchName:
          {
            type: string,
            description: "Home branch of the current plan (empty when unknown)",
          }
        homeGymId:
          {
            type: integer,
            nullable: true,
            description: "Local gym id mapped from the plan's YoActiv branch (null when unmapped)",
          }
        expiryKnown:
          {
            type: boolean,
            description: "False when the upstream system reported no expiry date (renewsOn is then a placeholder)",
          }
    LiveTrainer:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        photoUrl: { type: string, nullable: true }
    TrainerPackage:
      type: object
      required: [id, serviceName, name, amountInr, duration, pt]
      properties:
        id: { type: integer }
        serviceName: { type: string }
        name: { type: string }
        amountInr: { type: number }
        sessions: { type: integer, nullable: true }
        duration: { type: string }
        pt: { type: boolean }
        description: { type: string, description: "Admin-set display description (empty when unset)" }
        imageUrl: { type: string, description: "Admin-set display image URL (empty when unset)" }
    CreateTrainerBookingRequest:
      type: object
      required: [gymId, packageId, name, mobile, preferredDate]
      properties:
        gymId: { type: integer }
        packageId: { type: integer }
        trainerId: { type: string }
        trainerName: { type: string }
        name: { type: string, minLength: 2 }
        mobile: { type: string, minLength: 10 }
        preferredDate: { type: string, description: "ISO date (YYYY-MM-DD)" }
        couponCode:
          type: string
          description: "Optional coupon code — validated and applied server-side"
        redeemPoints:
          type: integer
          minimum: 0
          description: "Wallet points (₹) to apply as a discount — clamped server-side, at least ₹1 stays payable"
    TrainerBookingCreated:
      type: object
      required: [id, status, amountInr, paymentUrl]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, paid, failed] }
        amountInr: { type: number }
        paymentUrl: { type: string }
    TrainerBooking:
      type: object
      required: [id, status, amountInr, packageName, trainerName, gymName, preferredDate, createdAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, paid, failed, enquiry] }
        amountInr: { type: number }
        packageName: { type: string }
        trainerName: { type: string }
        gymName: { type: string }
        preferredDate: { type: string }
        createdAt: { type: string, format: date-time }
    PtSession:
      type: object
      required: [id, date, time, status]
      properties:
        id: { type: integer }
        date: { type: string, description: "YYYY-MM-DD (IST)" }
        time: { type: string, description: "HH:MM 24h (IST)" }
        status: { type: string, enum: [scheduled, completed, cancelled] }
    PtProgram:
      type: object
      required: [active, trainerName, gymName, packageName, totalSessions, completedCount, sessions]
      properties:
        active: { type: boolean, description: "True when the caller has a PT enrolment with an assigned trainer" }
        kickstarterCompleted: { type: boolean, description: "True when the free kick-starter (2 trial sessions) is completed" }
        hasPaidPlan: { type: boolean, description: "True when the caller already has a paid PT booking" }
        plan:
          type: object
          nullable: true
          description: "The caller's paid PT plan — present only after the plan payment landed"
          required: [packageName, gymName, trainerName, totalSessions, sessionsDelivered, startDate, endDate, expired]
          properties:
            packageName: { type: string }
            gymName: { type: string }
            trainerName: { type: string, description: "Trainer managing the plan ('' when not assigned yet)" }
            totalSessions: { type: integer, description: "Sessions included in the plan" }
            sessionsDelivered: { type: integer, description: "Sessions completed so far (trainer attendance)" }
            startDate: { type: string, description: "YYYY-MM-DD" }
            endDate: { type: string, description: "YYYY-MM-DD" }
            expired: { type: boolean }
        gymId: { type: integer, nullable: true, description: "Branch of the current PT enrolment (for booking a paid plan)" }
        trainerName: { type: string }
        trainerPhotoUrl: { type: string, description: "Staff-uploaded photo of the assigned trainer ('' when none)" }
        gymName: { type: string }
        packageName: { type: string }
        totalSessions: { type: integer, description: "Sessions included per month (12)" }
        completedCount: { type: integer }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PtSession" }
    ComplaintCreate:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 3, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 2000 }
        gymId: { type: integer, nullable: true, description: "Branch the complaint is about (optional)" }
    Complaint:
      type: object
      required: [id, subject, message, status, gymName, response, followUps, createdAt]
      properties:
        id: { type: integer }
        subject: { type: string }
        message: { type: string }
        status: { type: string, enum: [open, in_progress, resolved] }
        gymName: { type: string }
        response: { type: string, description: "Reply from the gym team ('' when none yet)" }
        followUps:
          type: array
          description: "Member follow-up messages, oldest first"
          items: { $ref: "#/components/schemas/ComplaintFollowUp" }
        createdAt: { type: string, format: date-time }
    ComplaintFollowUp:
      type: object
      required: [message, reopened, at]
      properties:
        message: { type: string, description: "Member's follow-up text ('' when they only tapped reopen)" }
        reopened: { type: boolean, description: "True when this follow-up reopened the ticket" }
        at: { type: string, format: date-time }
    ComplaintFollowUpRequest:
      type: object
      properties:
        message: { type: string, maxLength: 2000, description: "Optional follow-up text" }
        reopen: { type: boolean, description: "Set true to flip a resolved ticket back to open" }
    PtTrialFeedback:
      type: object
      required: [sessionNo, rating, comment]
      properties:
        sessionNo: { type: integer, description: "Trial session number (1 or 2)" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
    EngagementDayCard:
      type: object
      required: [day, title, focus, restDay, warmup, workout, cardio, core, stretching]
      properties:
        day: { type: integer, description: "1-based day number in the 45-day plan" }
        title: { type: string }
        focus: { type: string }
        restDay: { type: boolean }
        warmup: { type: array, items: { type: string } }
        workout: { type: array, items: { type: string } }
        cardio: { type: array, items: { type: string } }
        core: { type: array, items: { type: string } }
        stretching: { type: array, items: { type: string } }
    MyEngagement:
      type: object
      required: [active, level, dayNumber, totalDays, startDate, gymName, dieticianName, score, scoreBand, showPtOffer]
      properties:
        active: { type: boolean, description: "True when a 45-day engagement program is running" }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        dayNumber: { type: integer, description: "Current day (1-45); 0 when inactive" }
        totalDays: { type: integer }
        startDate: { type: string, description: "YYYY-MM-DD (IST); '' when inactive" }
        gymName: { type: string }
        dieticianName: { type: string, description: "In-house dietician the member is assigned to" }
        score: { type: integer, description: "Engagement score 0-100" }
        scoreBand: { type: string, enum: [green, yellow, red] }
        showPtOffer: { type: boolean, description: "True when the member hasn't purchased PT yet" }
        today:
          allOf: [{ $ref: "#/components/schemas/EngagementDayCard" }]
          nullable: true
    MyEngagementPlan:
      type: object
      required: [level, days]
      properties:
        level: { type: string, enum: [beginner, intermediate, advanced] }
        days:
          type: array
          items: { $ref: "#/components/schemas/EngagementDayCard" }
