      type: object
      required: [code, amountInr, kind]
      properties:
        code: { type: string }
        amountInr: { type: integer, description: "Purchase list price (₹)" }
        kind: { type: string, enum: [package, pt] }
        mobile: { type: string, description: "Optional — helps enforce per-user limits for guests" }
    CouponPreviewResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        error: { type: string, description: "Friendly reason when valid=false" }
