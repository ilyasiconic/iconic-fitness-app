      type: object
      required: [id, slotDate, slotTime, status, gymName, createdAt]
      properties:
        id: { type: integer }
        slotDate: { type: string, description: "YYYY-MM-DD (IST)" }
        slotTime: { type: string, description: "HH:MM 24h (IST), early morning" }
        status: { type: string, enum: [booked, completed, cancelled] }
        gymName: { type: string }
        createdAt: { type: string, format: date-time }
    MyAssessment:
      type: object
      required: [eligible, slotTimes]
      properties:
        eligible: { type: boolean, description: "True once the member's kick-starter trial request has been accepted" }
        slotTimes:
          type: array
          items: { type: string }
          description: "Bookable early-morning slot times (HH:MM, IST)"
        booking:
          allOf: [{ $ref: "#/components/schemas/AssessmentBooking" }]
          nullable: true
          description: "The member's upcoming (booked) assessment, if any"
        lastCompleted:
          allOf: [{ $ref: "#/components/schemas/AssessmentBooking" }]
          nullable: true
          description: "Most recent completed assessment, if any"
